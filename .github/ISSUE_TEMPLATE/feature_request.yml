name: 功能请求
description: 想要新的能力，或现有行为需要调整
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清「解决什么问题」。本插件有三条硬约束，碰它们的需求大概率会被拒：
        1. 绝不注册 / 修改系统提示词段（前缀缓存不能破）；
        2. 只做纯 append，不重写历史前缀；
        3. 规则文本不变时一条消息都不追加（零 token）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在怎么做、卡在哪。不要只写「希望支持 X」。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束自检
      options:
        - label: 这个需求不需要改动系统提示词
        - label: 这个需求不会让每轮都重复注入同样的内容
